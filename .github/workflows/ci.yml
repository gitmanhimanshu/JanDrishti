name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # The suite runs against PostgreSQL and Redis, not substitutes: partial
    # indexes, full-text search and the constraint behaviour under concurrency
    # are precisely what a different backend would fail to exercise.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jandrishti_test
          POSTGRES_USER: jandrishti
          POSTGRES_PASSWORD: jandrishti
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Django system check (production settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-secret-key-not-used-for-anything-real-0123456789
          DATABASE_URL: postgres://jandrishti:jandrishti@localhost:5432/jandrishti_test
          REDIS_URL: redis://localhost:6379/0
          ALLOWED_HOSTS: localhost
        run: python manage.py check --deploy --fail-level WARNING

      - name: Missing migrations check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://jandrishti:jandrishti@localhost:5432/jandrishti_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=jandrishti --cov-report=term-missing --cov-fail-under=70

  security:
    name: Security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit tools
        run: pip install pip-audit bandit

      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-none || true

      - name: Static security scan
        # B101 is the assert check; pytest is built on asserts.
        run: bandit -r jandrishti -ll --skip B101

      - name: No secrets committed
        working-directory: .
        run: |
          if git grep -nIE "(SECRET_KEY|API_KEY|CLIENT_SECRET)[[:space:]]*=[[:space:]]*['\"][A-Za-z0-9_\-]{16,}" -- ':!*.example' ':!*/tests/*' ':!.github/*'; then
            echo "::error::A real-looking secret appears to be committed."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
